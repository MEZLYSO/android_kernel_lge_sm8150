name: Build LG G8 ThinQ Kernel (LineageOS 22.2)

on:
  push:
    branches: [ main, lineage-22.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Download Toolchains
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          # Descarga de Clang (LineageOS r487747)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r487747 clang
          # Descarga de GCC (Necesarios para headers y soporte de 32 bits)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Set build environment
        run: |
          # Añadir binarios al PATH de GitHub Actions de forma persistente
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          echo "$HOME/toolchains/gcc64/bin" >> $GITHUB_PATH
          echo "$HOME/toolchains/gcc32/bin" >> $GITHUB_PATH
          
          # Definir variables de entorno para los siguientes pasos
          {
            echo "ARCH=arm64"
            echo "SUBARCH=arm64"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"
            echo "CROSS_COMPILE=aarch64-linux-android-"
            echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-"
            echo "LD_LIBRARY_PATH=$HOME/toolchains/clang/lib64:$LD_LIBRARY_PATH"
          } >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          key: kernel-alphalm-${{ github.sha }}
          restore-keys: kernel-alphalm-

      - name: Generate kernel config
        run: |
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            lineageos_alpha_defconfig

      - name: Verify flags in generated .config
        run: |
          grep -E "CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_NAMESPACES" out/.config || echo "⚠️ Flags no encontrados, revisa el defconfig"

      - name: Build kernel
        run: |
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            -j$(nproc --all) \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-alphalm-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          retention-days: 7

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 3
