name: Build LG G8 ThinQ Kernel (LineageOS 21)

on:
  push:
    branches: [ main, lineage-21 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Download Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          # Using a more recent Clang version (r522815 is common for Android 15/Lineage 22)
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r522815 \
            clang
          # Note: Modern kernels often use LLVM=1 instead of separate GCC wrappers
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Set build environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CLANG_PATH=$HOME/toolchains/clang/bin" >> $GITHUB_ENV
          echo "GCC64_PATH=$HOME/toolchains/gcc64/bin" >> $GITHUB_ENV
          echo "GCC32_PATH=$HOME/toolchains/gcc32/bin" >> $GITHUB_ENV
          # Added LD_LIBRARY_PATH to ensure Clang finds its internal libs
          echo "LD_LIBRARY_PATH=$HOME/toolchains/clang/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Verify IPC/PID flags in defconfig
        run: |
          DEFCONFIG="arch/arm64/configs/lineageos_alpha_defconfig"
          grep "CONFIG_IPC_NS=y" $DEFCONFIG && echo "✅ IPC_NS ok" || (echo "❌ CONFIG_IPC_NS=y falta" && exit 1)
          grep "CONFIG_PID_NS=y" $DEFCONFIG && echo "✅ PID_NS ok" || (echo "❌ CONFIG_PID_NS=y falta" && exit 1)

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          key: kernel-alphalm-${{ github.sha }}
          restore-keys: kernel-alphalm-

      - name: Generate kernel config
        run: |
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            lineageos_alpha_defconfig

      - name: Verify flags in generated .config
        run: |
          grep -E "CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_NAMESPACES" out/.config

      - name: Build kernel
        run: |
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"
          make O=out \
            ARCH=arm64 \
            CC=clang \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc --all) \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-alphalm-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          retention-days: 7

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 3
