name: Build LG G8 ThinQ Kernel (LineageOS 22.2)

on:
  push:
    branches: [ main, lineage-22.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 python2

      - name: Download Toolchains
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains

          # 1. Descargar Clang r487747 (Método Robusto)
          echo "--- Descargando Clang r487747 ---"
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-sdk
          cd clang-sdk
          git sparse-checkout set clang-r487747
          # Forzar la aparición de los archivos
          git checkout
          # Mover el contenido a la carpeta final
          mv clang-r487747 ../clang
          cd ..
          rm -rf clang-sdk

          # 2. Descargar GCC (Necesario para el LG G8 / SD855)
          echo "--- Descargando GCC 64 y 32 bits ---"
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Set build environment
        run: |
          # Rutas absolutas para evitar confusiones
          CLANG_BIN="$HOME/toolchains/clang/bin"
          GCC64_BIN="$HOME/toolchains/gcc64/bin"
          GCC32_BIN="$HOME/toolchains/gcc32/bin"

          # Añadir al PATH de la sesión
          echo "$CLANG_BIN" >> $GITHUB_PATH
          echo "$GCC64_BIN" >> $GITHUB_PATH
          echo "$GCC32_BIN" >> $GITHUB_PATH
          
          # Variables para el compilador
          {
            echo "ARCH=arm64"
            echo "SUBARCH=arm64"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"
            echo "CROSS_COMPILE=aarch64-linux-android-"
            echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-"
            echo "LD_LIBRARY_PATH=$HOME/toolchains/clang/lib64:$LD_LIBRARY_PATH"
          } >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          key: kernel-alphalm-${{ github.sha }}
          restore-keys: kernel-alphalm-

      - name: Generate kernel config
        run: |
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            lineageos_alpha_defconfig

      - name: Build kernel
        run: |
          # Aseguramos que el log exista desde el inicio
          touch build.log
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            -j$(nproc --all) \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-alphalm-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          retention-days: 7

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 3
